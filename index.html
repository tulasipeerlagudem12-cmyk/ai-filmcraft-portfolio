<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prashanth Ajipuram — AI Filmcraft</title>
<style>
:root{--bg:#0a0a0c;--sf:#141418;--tx:#ece8e1;--mu:#8d8a85;--ac:#d9a441;--ln:#26262c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,'Times New Roman',serif}
a{color:inherit}button,input,select{font:inherit;color:inherit}.sans,button,input,select,nav{font-family:system-ui,sans-serif}

main{padding:0 5vw 80px}.hero{padding:12vh 0 6vh;max-width:900px}h1{font-size:clamp(34px,6vw,68px);line-height:1.05;margin:0 0 18px;font-weight:400}h1 em{color:var(--ac)}

.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.clips button{background:var(--sf);border:1px solid var(--ln);padding:0;cursor:pointer;text-align:left;overflow:hidden}.clips video{aspect-ratio:16/9;object-fit:cover;pointer-events:none}.clips span{display:block;padding:5px 8px;font:12px system-ui;color:var(--mu)}.clips button:hover{border-color:var(--ac)}.tabs{display:flex;overflow-x:auto;border:1px solid var(--ln);margin:18px 0;position:sticky;top:50px;background:var(--sf);z-index:4}.tabs button{background:none;border:0;padding:14px 18px;letter-spacing:.12em;font-size:12px;text-transform:uppercase;white-space:nowrap;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--ac);color:#111}h2,video{scroll-margin-top:110px}.studies{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
details{border:1px solid var(--ln);background:var(--sf);margin:8px 0}summary{padding:12px 16px;cursor:pointer}details>div{padding:0 16px 14px}pre{white-space:pre-wrap;word-break:break-word;background:#0e0e11;border:1px solid var(--ln);padding:12px;font:13px/1.55 ui-monospace,monospace;margin:6px 0}
.lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;padding:3vw}.lb video{max-height:90vh}.lb button{position:absolute;top:14px;right:18px;font-size:26px;background:none;border:0;cursor:pointer}
.empty{color:var(--mu);padding:30px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 18px;font:14px system-ui}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><a class="logo" href="#">PRASHANTH AJIPURAM</a><nav><a href="#projects">Projects</a><a href="#process">Process</a><a href="#contact">Contact</a></nav></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
const P=window.PROJECTS,app=document.getElementById('app');

  if(!f.length)grid.append(h('p',{className:'empty'},'No projects match.'));

 const chips=h('div',{className:'bar'},h('input',{type:'search',placeholder:'Search projects\u2026',ariaLabel:'Search projects',on:{input:e=>{q=e.target.value;draw()}}}),cats.map(c=>h('button',{className:'chip'+(c===cat?' on':''),on:{click:e=>{cat=c;[...chips.querySelectorAll('.chip')].forEach(b=>b.classList.toggle('on',b===e.target));draw()}}},c)));

 app.replaceChildren(h('section',{className:'hero'},h('span',{className:'num'},'PRASHANTH AJIPURAM \u00b7 AI FILMCRAFT'),h('h1',{},'Stories made with ',h('em',{},'AI'),', frame by frame.'),h('p',{className:'mu'},'A portfolio of AI-generated films: '+P.length+' projects, with the full prompts behind every shot.'),h('a',{className:'btn',href:'#projects'},'Explore Projects')),
  h('section',{id:'projects'},h('h2',{},'Projects ('+P.length+')'),chips,grid),
  h('section',{id:'process'},h('h2',{},'Creative process'),h('div',{className:'steps'},['Concept and narrative development','Character and environment references','Storyboard and shot planning','Cinematic prompt engineering','AI video generation','Review, refinement and continuity','Final film presentation'].map(s=>h('div',{},s)))),h('section',{id:'contact'},h('h2',{},'Contact'),h('p',{},'Prashanth Ajipuram'),h('a',{className:'btn',href:'tel:9177433476'},'9177433476')))}
function proj(id){const i=P.findIndex(p=>p.id===id);if(i<0)return home();const p=P[i],pr=P[i-1],nx=P[i+1];document.title=p.title+' \u2014 Prashanth Ajipuram';
 const v=h('video',{id:'wf',controls:true,playsInline:true,preload:'metadata',poster:p.thumb});let li=0;

 const all=p.shots.map(s=>'SHOT '+s.n+' - '+s.t+(s.i?'\n\nIMAGE PROMPT:\n'+s.i:'')+(s.v?'\n\nVIDEO PROMPT:\n'+s.v:'')).join('\n\n----\n\n');
 const cp=(l,t)=>h('button',{className:'btn o',on:{click:()=>copy(t)}},l);
 const go=id=>{const e=document.getElementById(id);e&&e.scrollIntoView({behavior:'smooth'})};const tabs=h('div',{className:'tabs',role:'tablist'},[['Watch film','wf',1],['References','rf',p.refs&&p.refs.length],['Frame studies','fs',p.studies&&p.studies.length],['Start frames','sf',p.stills&&p.stills.length],['Shot clips','sc',p.clips.length],['Prompts','pm',1]].filter(t=>t[2]).map((t,i)=>h('button',{on:{click:e=>{go(t[1]);[...tabs.children].forEach(b=>b.classList.toggle('on',b===e.target))}}},'0'+(i+1)+' / '+t[0])));const dir='assets/p'+(+p.id)+'/clips/';
 app.replaceChildren(...[
  h('div',{className:'top'},h('a',{className:'btn o',href:'#projects'},'\u2190 Back to Projects'),h('span',{},pr?h('a',{className:'btn o',href:'#project/'+pr.id},'\u2039 Previous'):null,' ',nx?h('a',{className:'btn o',href:'#project/'+nx.id},'Next \u203a'):null)),
  h('span',{className:'num'},'PROJECT '+p.id),h('h1',{},p.title),h('p',{className:'mu'},p.desc),
  h('div',{className:'facts'},[['Category',p.cat],['Shots in prompt book',p.shots.length],['Clips',p.clips.length]].map(([a,b])=>h('div',{},h('b',{},a),b))),
  tabs,p.reel?h('div',{className:'ctl'},h('button',{className:'btn o',on:{click:()=>{v.src=p.film;v.play()}}},'Final film'),h('button',{className:'btn o',on:{click:()=>{v.src=p.reel;v.play()}}},'Shot reel')):null,v,h('div',{className:'ctl'},'Speed ',sp,h('label',{},h('input',{type:'checkbox',on:{change:e=>v.loop=e.target.checked}}),' Loop'),p.film?null:h('span',{className:'mu'},'Final film not uploaded; playing the shot clips in order.')),
  gal(p.refs,'rf','References','Key reference images for the film.','REFERENCE'),p.studies&&p.studies.length?[h('h2',{id:'fs'},'Film frame studies'),h('p',{className:'mu'},'Selected frames from the actual film. Use them to compare composition, color, character continuity and staging.'),h('div',{className:'clips studies'},p.studies.map((f,i)=>h('button',{ariaLabel:'Open frame study '+(i+1),on:{click:()=>modal(f)}},h('img',{src:f,alt:'Frame study '+(i+1),loading:'lazy',style:'width:100%;aspect-ratio:16/9;object-fit:cover;display:block'}),h('span',{},'FRAME STUDY / '+String(i+1).padStart(2,'0')))))]:null,gal(p.stills,'sf','Start frames and stills','Generated images used as starting points and look tests.','IMAGE'),h('h2',{id:'sc'},'Shot clips'),h('div',{className:'clips'},p.clips.map(c=>h('button',{ariaLabel:'Play '+c,on:{click:()=>modal(dir+c)}},h('video',{src:dir+c+'#t=0.6',preload:'metadata',muted:true}),h('span',{},c.replace('.mp4',''))))),
  p.bible?h('div',{},h('h2',{},'Character bible'),h('details',{},h('summary',{},'Show character profiles'),h('div',{},h('pre',{},p.bible)))):null,
  h('h2',{id:'pm'},'Prompts'),h('p',{className:'mu'},p.note),
  h('div',{className:'ctl'},cp('Copy all prompts',all),(p.pdfs||[]).map(x=>h('a',{className:'btn o',href:x[1],target:'_blank',rel:'noopener'},x[0])),h('a',{className:'btn',href:p.file,download:p.slug+'-prompts.txt'},'Download TXT')),
  p.style?h('details',{},h('summary',{},'Global visual style'),h('div',{},h('pre',{},p.style),cp('Copy',p.style))):null,
  p.shots.map(s=>h('details',{},h('summary',{},'Shot '+String(s.n).padStart(2,'0')+' \u2014 '+s.t+(s.d?' ('+s.d+' sec)':'')),h('div',{},
   s.i?[h('b',{className:'sans'},'Image prompt'),h('pre',{},s.i),cp('Copy image prompt',s.i)]:null,
   s.v?[h('b',{className:'sans'},'Video prompt'),h('pre',{},s.v),cp('Copy video prompt',s.v)]:null))),
  p.neg?h('details',{},h('summary',{},'Negative prompt'),h('div',{},h('pre',{},p.neg),cp('Copy',p.neg))):null].flat(Infinity).filter(x=>x!=null))}
function gal(list,id,title,note,lab){if(!list||!list.length)return null;return [h('h2',{id},title),note?h('p',{className:'mu'},note):null,h('div',{className:'clips studies'},list.map((x,i)=>h('button',{ariaLabel:'Open image '+(i+1),on:{click:()=>modal(x.l||x.t)}},h('img',{src:x.t,alt:title+' '+(i+1),loading:'lazy',style:'width:100%;aspect-ratio:16/9;object-fit:contain;background:#0e0e11;display:block'}),h('span',{},lab+' / '+String(i+1).padStart(2,'0')))))]}
function route(){const m=location.hash.match(/^#project\/(\d+)$/);m?proj(m[1]):home();if(m)scrollTo(0,0);else if(location.hash){const e=document.getElementById(location.hash.slice(1));e&&e.scrollIntoView()}}

</script></body></html>
